name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests are hermetic: they never call a real provider.  The live contract
      # suite is opt-in and excluded by the pytest markers in pyproject.toml.
      MARS_UI_ALLOW_ANONYMOUS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system libraries (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libffi8 libgdk-pixbuf-2.0-0 libharfbuzz0b \
            libjpeg62-turbo libopenjp2-7 libpango-1.0-0 libpangoft2-1.0-0 \
            shared-mime-info

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests (coverage gate 70%)
        run: python -m pytest -q --cov=mars --cov-report=term-missing --cov-report=xml

      - name: Evaluation gate (domain lock and dataset)
        run: python -m mars.cli eval --dataset evals/agentic_ai_v1.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: pip-audit (advisory)
        # Advisory until the transitive dependency baseline is triaged; the
        # SBOM below is always produced for release review.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mars:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: mars:ci
          artifact-name: mars-sbom.spdx.json
